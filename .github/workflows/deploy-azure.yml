name: Angular CI/CD to Azure

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

  push:
    branches: [dev]  # triggers after merge

jobs:

  # ✅ PR Validation Build
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Success message
        if: success()
        run: echo "✅ PR build successful"


  # ✅ Deploy after merge to dev
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: userportal
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E37A9E4C5EBB4F62B5280ADFDB8E3561 }}
          package: ./dist

      - name: Success message
        if: success()
        run: echo "✅ Angular app deployed to Azure successfully!"
