<div class="profile-content">

  <div class="profile-header">
    <h1>My Profile</h1>
  </div>

  <div class="profile-grid">

    <!-- Photo Upload Section -->
    <div class="photo-section">

      <div class="photo-container">
        <img
          [src]="profilePhotoPreview"
          alt="Profile Photo"
          class="profile-photo"
        />
      </div>

      <div class="photo-actions">

        <input
          type="file"
          #photoInput
          (change)="onPhotoSelected($event)"
          accept="image/*"
          class="hidden-input"
        />

        <button
          type="button"
          (click)="photoInput.click()"
          class="btn btn-secondary">
          Change Photo
        </button>

        <p class="photo-info">
          JPG, PNG up to 5MB
        </p>

      </div>

    </div>


    <!-- Profile Form -->
    <div class="form-section">

      <form
        [formGroup]="profileForm"
        (ngSubmit)="onUpdateProfile()">


        <div class="form-row">

          <div class="form-group">

            <label>First Name</label>

            <input
              type="text"
              formControlName="first_name"
              class="form-control"
            />

            <small
              class="error"
              *ngIf="isFieldInvalid('first_name')">
              First name is required
            </small>

          </div>



          <div class="form-group">

            <label>Last Name</label>

            <input
              type="text"
              formControlName="last_name"
              class="form-control"
            />

            <small
              class="error"
              *ngIf="isFieldInvalid('last_name')">
              Last name is required
            </small>

          </div>

        </div>



        <div class="form-group">

          <label>Email</label>

          <input
            type="email"
            formControlName="email"
            class="form-control"
            readonly
          />

        </div>



        <div class="form-group">

          <label>Phone Number</label>

          <input
            type="tel"
            formControlName="phone_number"
            class="form-control"
          />

        </div>



        <div class="form-row">


          <div class="form-group">

            <label>City</label>

            <input
              type="text"
              formControlName="city"
              class="form-control"
            />

          </div>



          <div class="form-group">

            <label>State</label>

            <input
              type="text"
              formControlName="state"
              class="form-control"
            />

          </div>


        </div>



        <div class="form-row">


          <div class="form-group">

            <label>Country</label>

            <input
              type="text"
              formControlName="country"
              class="form-control"
            />

          </div>



          <div class="form-group">

            <label>Postal Code</label>

            <input
              type="text"
              formControlName="postal_code"
              class="form-control"
            />

          </div>


        </div>




        <div class="form-group">

          <label>Address</label>

          <input
            type="text"
            formControlName="address"
            class="form-control"
          />

        </div>




        <div class="form-group">

          <label>Date of Birth</label>

          <input
            type="date"
            formControlName="date_of_birth"
            class="form-control"
          />

        </div>




        <div class="form-group">

          <label>Gender</label>

          <select
            formControlName="gender"
            class="form-control">

            <option value="">
              Select Gender
            </option>

            <option value="male">
              Male
            </option>

            <option value="female">
              Female
            </option>

          </select>

        </div>




        <div class="form-group">

          <label>Bio</label>

          <textarea
            formControlName="Bio"
            rows="4"
            class="form-control"
            placeholder="Tell us about yourself...">
          </textarea>

        </div>




        <div class="form-actions">


          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="profileForm.invalid || isSaving">

            {{ isSaving ? 'Saving...' : 'Save Changes' }}

          </button>



          <button
            type="button"
            class="btn btn-secondary"
            (click)="onCancel()">

            Cancel

          </button>


        </div>




        <div
          *ngIf="successMessage"
          class="success-message">

          {{ successMessage }}

        </div>




        <div
          *ngIf="errorMessage"
          class="error-message">

          {{ errorMessage }}

        </div>


      </form>

    </div>

  </div>

</div>
