<div class="container">

  <div class="card">

    <h2 class="title">Create Account</h2>

    <form [formGroup]="registrationForm">

      <!-- STEP INDICATOR -->
      <div class="steps">
        <div [class.active]="step === 1">1. Personal</div>
        <div [class.active]="step === 2">2. Account</div>
      </div>

      <!-- STEP 1 -->
      <div *ngIf="step === 1" class="form-grid">

        <div class="form-group">
          <label>First Name</label>
          <input formControlName="first_name">
          <small *ngIf="registrationForm.get('first_name')?.touched && registrationForm.get('first_name')?.invalid">
            Required
          </small>
        </div>

        <div class="form-group">
          <label>Last Name</label>
          <input formControlName="last_name">
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input formControlName="phone_number">
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" formControlName="date_of_birth">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select formControlName="gender">
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group full">
          <label>Address</label>
          <input formControlName="address">
        </div>

        <div class="form-group">
          <label>City</label>
          <input formControlName="city">
        </div>

        <div class="form-group">
          <label>State</label>
          <input formControlName="state">
        </div>

        <div class="form-group">
          <label>Country</label>
          <input formControlName="country">
        </div>

        <div class="form-group">
          <label>Postal Code</label>
          <input formControlName="postal_code">
        </div>

      </div>

      <!-- STEP 2 -->
      <div *ngIf="step === 2" class="form-grid">

        <div class="form-group full">
          <label>Email</label>
          <input formControlName="email" type="email">
        </div>

        <div class="form-group full">
          <label>Password</label>
          <input formControlName="password" type="password">
        </div>

      </div>

      <!-- BUTTONS -->
      <div class="actions">

        <button type="button" class="btn secondary" (click)="prevStep()" *ngIf="step === 2">
          Back
        </button>

        <button type="button" class="btn primary" (click)="nextStep()" *ngIf="step === 1">
          Next
        </button>

        <button type="button" class="btn primary" (click)="submit()" *ngIf="step === 2">
          Submit
        </button>

      </div>

    </form>

  </div>

</div>
